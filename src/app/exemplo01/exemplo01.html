<div>
    <h4>{{post.titulo}}</h4>
    <small>
        por {{post.autor}} em {{post.data}}
    </small>
    <p>{{post.conteudo}}</p>

    @for (p of posts; track p.id) {
    <div>
        <h4>{{p.titulo}}</h4>
        <small>
            por {{p.autor}} em {{p.data}}
        </small>
        <p class="mt-2"> {{p.conteudo}}</p>
    </div>
    } @empty {
        <p>Nenhum post encontrado</p>
    }
</div>
